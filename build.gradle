plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.25'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = uri("https://neoforged.net") }
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    // В версии 7.1.25 настройки пишутся ТОЛЬКО внутри configureEach!
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        // Автоматически подключает миксины и ресурсы твоего мода к игре
        modSource project.sourceSets.main
    }

    // ИСПРАВЛЕНИЕ: Блоки client и server пишем пустыми, так как все системные свойства
    // и пути к миксинам NeoGradle 7.1.25 теперь подхватывает автоматически через modSource!
    client {
    }

    server {
        programArgument '--nogui'
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
compileJava {
    options.compilerArgs << "-Atokens=neoforge=true"
}
processResources.outputs.upToDateWhen { false }
