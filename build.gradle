import java.nio.file.Paths

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.25'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = uri("https://neoforged.net") }
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// === НАСТРОЙКИ ЗАПУСКА ИГРЫ (NeoForge 7.x) ===
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        // ⚙️ Безопасный способ передачи пути к нативной библиотеке в NeoForge Gradle
        systemProperty 'java.library.path', file('native').absolutePath
        jvmArguments.add("-Djava.library.path=${file('native').absolutePath}")

        modSource project.sourceSets.main
    }
}

subprojects {
    runs {
        data {
            data()
            programArguments.addAll '--mod', 'create_additional_energy_sourses',
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
        // ХАК ДЛЯ IDEA: силой заставляем среду компилировать ресурсы в правильную рабочую папку игры
        output.resourcesDir = file("${buildDir}/resources/main")
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

compileJava {
    options.compilerArgs << "-Atokens=neoforge=true"
}

processResources.outputs.upToDateWhen { false }

// === ТАСКА СБОРКИ НА ТВОЁМ CACHYOS (C++ СЛОЙ) ===
tasks.register('compileNativeCpp') {
    description = 'Компиляция нативного C++ кода для оптимизации взрывов ДВС'
    group = 'build'

    // Gradle следит за изменениями исходников: если файл не трогали, шаг пропустится автоматически
    inputs.file(file("native/crater_calculator.cpp"))
    outputs.file(file("native/libcreate_aes_native.so"))

    doLast {
        def javaHome = System.getProperty("java.home")
        def jniInclude = Paths.get(javaHome, "include").toString()
        def jniLinuxInclude = Paths.get(javaHome, "include", "linux").toString()

        def outputLib = file("native/libcreate_aes_native.so").absolutePath
        def sourceFile = file("native/crater_calculator.cpp").absolutePath

        println "=== Компиляция C++ через g++ (CachyOS Оптимизация) ==="

        exec {
            commandLine 'g++', '-O3', '-shared', '-fPIC',
                    "-I${jniInclude}",
                    "-I${jniLinuxInclude}",
                    '-o', outputLib, sourceFile
        }

        println "=== Нативная библиотека успешно собрана: libcreate_aes_native.so ==="
    }
}

// Связываем запуск компиляции нативов с фазами сборки Java
tasks.named('compileJava') {
    dependsOn compileNativeCpp
}
tasks.named('processResources') {
    dependsOn compileNativeCpp
}
